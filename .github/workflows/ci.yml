name: WorkflownameCI

on:
  push:
    branches:
      - 'master'
      - 'dev'

jobs:
  build:
    name: 'Build and push'
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [22,23,24]

    steps:
      - uses: actions/checkout@v6

    # - name: Setup node | ${{matrix.node}}
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn
      - run: yarn run test

      # get the first 7 characters of the commit id
      # then add the value of $SHA to github output (good practices)
      - name: Generate tag from commit
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::278084719385:role/ecr_role

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/configure-aws-credentials@v4

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: rhadamez/api-rocket:${{ steps.generate_tag.outputs.sha }},rhadamez/api-rocket:latest