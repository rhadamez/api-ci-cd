name: WorkflownameCI

on:
  push:
    branches:
      - 'master'
      - 'dev'

# with sensitive information, we need to pass this
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: 'Build and push'
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [22,23,24]

    steps:
      - uses: actions/checkout@v6

    # - name: Setup node | ${{matrix.node}}
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn
      - run: yarn run test

      # get the first 7 characters of the commit id
      # then add the value of $SHA to github output (good practices)
      - name: Generate tag from commit
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::278084719385:role/ecr_role #Amazon Resource Name (ARN)

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        id: build-docker-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha}}
        run: |
          docker build -t $REGISTRY/rhadamez-ci:$TAG .
          docker push $REGISTRY/rhadamez-ci:$TAG
          IMAGE=$(echo $REGISTRY/rhadamez-ci:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: rhadamez-ci
          image: ${{ steps.build-docker-image.outputs.image }}
          access-role-rn: arn:aws:iam::278084719385:role/app-runner-role
          region: us-east-1
          cpu: 1
          memory: 1
          port: 3000

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

